<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="扭蛋機">
<title>小伶魔法世界扭蛋機</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #fff5f5, #ffe8f5, #fff9e6, #ffe8f5);
    background-size: 400% 400%;
    animation: bgShift 10s ease infinite;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 15px 10px 30px;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* === Character Decorations === */
  .char-left, .char-right {
    display: none;
  }
  .char-left { left: 5px; }
  .char-right { right: 5px; }
  .char-left img, .char-right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .char-left { animation: charFloat 4s ease-in-out infinite; }
  .char-right { animation: charFloat 4s ease-in-out infinite 1s; }
  @keyframes charFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* === Top Character Banner === */
  .char-banner {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 8px;
  }
  .char-circle {
    width: 65px;

  .capsule-overlay {

  .capsule-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;

    z-index: 2;
    background: transparent;
  }
  .capsule-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 52%;
    border-radius: 0 0 100px 100px;
    z-index: 1;

  .capsule-line {
    position: absolute;

    border-radius: 2px;
    z-index: 3;

  .capsule-shine {
    position: absolute;
    top: 18px; left: 28px;
    width: 30px; height: 22px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    transform: rotate(-30deg);
    z-index: 4;

  .capsule.bounce {
    animation: capsuleBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes capsuleBounce {
    0% { transform: translateY(-400px) scale(0.5); opacity: 0; }
    50% { transform: translateY(20px) scale(1.1); opacity: 1; }
    70% { transform: translateY(-15px) scale(0.95); }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .capsule.opened .capsule-top {
    transform: translateY(-45px) rotate(-30deg);
    background: rgba(255,255,255,0.5) !important;
  }
  .capsule.opened .capsule-face img {
    animation: faceGrow 0.4s ease forwards;
  }
  @keyframes faceGrow {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }
  }

  .magic-sparkles {
    position: absolute;
    width: 200px; height: 200px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);

    z-index: 10;

  .sparkle {
    position: absolute;
    font-size: 18px;

    opacity: 0;

  @keyframes sparkleOut {
    0% { transform: translate(0,0) scale(0); opacity: 1; }

  .capsule-tap-hint {

  ];

  const BALL_COLORS = [
    ['#ff69b4','#ff1493'], ['#ffd700','#ffb347'], ['#ffb6c1','#ff69b4'],
    ['#ffa8d8','#ff6eb4'], ['#ffe44d','#ffd700'], ['#ff9ff3','#f368e0'],
    ['#ffcc5c','#f39c12'], ['#ff85a2','#ff5580'], ['#ffeaa7','#fdcb6e'],
  ];

  const DEFAULT_PLACES = [
    // 公園
    { name: '4號公園 🌳', weight: 1 },
    { name: '桃園公園 🌳', weight: 1 },
    { name: '風禾公園 🛝', weight: 1 },
    { name: '大佳河濱公園 🛝', weight: 1 },
    { name: '林口樂活公園 🛝', weight: 1 },
    // 博物館 / 知識
    { name: '科教館 🔬', weight: 1 },
    { name: '天文館 🔭', weight: 1 },
    { name: '臺博館土銀恐龍館 🦕', weight: 1 },
    { name: '十三行博物館 🏛️', weight: 1 },
    { name: '鶯歌陶瓷博物館 🏺', weight: 1 },
    { name: '台灣昆蟲館 🐛', weight: 1 },
    // 自然 / 戶外
    { name: '關渡自然公園 🦆', weight: 1 },
    { name: '野柳地質公園 🪨', weight: 1 },
    { name: '陽明山擎天崗 🐂', weight: 1 },
    { name: '十分瀑布＋放天燈 🏮', weight: 1 },
    { name: '貓空纜車 🚡', weight: 1 },
    // 體驗 / 遊樂
    { name: '水族館（潮境）🐠', weight: 1 },
    { name: '水族館（Xpark）🐠', weight: 1 },
    { name: '台北兒童樂園 🎠', weight: 1 },
    { name: '台北動物園 🦁', weight: 1 },
    { name: '郭元益糕餅博物館 🍪', weight: 1 },
    { name: '小人國 🏰', weight: 1 },
    // 日常
    { name: '圖書館 📚', weight: 1 },
    { name: '騎腳踏車 🚲', weight: 1 },
    { name: '看電影 🎬', weight: 1 },
    // 低機率
    { name: '巧虎樂園 🐯', weight: 0.5 },
  ];

  function getPlaces() {
    var saved = localStorage.getItem('weekend-places-v6');
    if (saved) return JSON.parse(saved);
    localStorage.setItem('weekend-places-v6', JSON.stringify(DEFAULT_PLACES));
    return DEFAULT_PLACES.slice();
  }
  function savePlaces(places) {
    localStorage.setItem('weekend-places-v6', JSON.stringify(places));
  }

  function weightedRandom(places) {
    var totalWeight = 0;
    for (var i = 0; i < places.length; i++) totalWeight += (places[i].weight || 1);
    var r = Math.random() * totalWeight;
    var cumulative = 0;
    for (var i = 0; i < places.length; i++) {
      cumulative += (places[i].weight || 1);
      if (r <= cumulative) return places[i].name;
    }
    return places[places.length - 1].name;
  }

  var CHAR_NAMES = ['小伶', '夏天', '悅兒'];

  // Set banner images from CHAR_IMAGES
  document.getElementById('bannerLeft').src = CHAR_IMAGES[1];   // 夏天
  document.getElementById('bannerCenter').src = CHAR_IMAGES[0]; // 小伶
  document.getElementById('bannerRight').src = CHAR_IMAGES[2];  // 悅兒

  let currentPick = '';
  let currentCharIndex = 0;
  let isAnimating = false;

  function renderBalls() {
    var box = document.getElementById('glassBox');
    var places = getPlaces();
    box.innerHTML = '';
    var count = Math.min(places.length, 6);
    for (var i = 0; i < count; i++) {
      var ball = document.createElement('div');
      ball.className = 'mini-ball';
      var img = document.createElement('img');
      img.src = CHAR_IMAGES[i % CHAR_IMAGES.length];
      img.alt = '';
      ball.appendChild(img);
      box.appendChild(ball);
    }
  }

  function twist() {
    if (isAnimating) return;
    var places = getPlaces();
    if (places.length === 0) { alert('清單是空的！請先新增地點 ⚙️'); return; }
    isAnimating = true;
    currentPick = weightedRandom(places);
    currentCharIndex = Math.floor(Math.random() * CHAR_IMAGES.length);

    const btn = document.getElementById('twistBtn');
    btn.classList.add('spinning');
    const color = BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];

    setTimeout(function() {
      btn.classList.remove('spinning');
      var overlay = document.getElementById('capsuleOverlay');
      var capsule = document.getElementById('capsule');
      var capsuleTop = document.getElementById('capsuleTop');
      var capsuleBottom = document.getElementById('capsuleBottom');
      var tapHint = document.getElementById('tapHint');
      var resultCard = document.getElementById('resultCard');
      var scene = document.getElementById('capsuleScene');

      document.getElementById('capsuleFace').src = CHAR_IMAGES[currentCharIndex];
      capsuleTop.style.background = 'rgba(255,255,255,0.1)';
      capsuleBottom.style.background = 'rgba(255,255,255,0.1)';

      capsule.classList.remove('bounce', 'opened');
      capsule.style.display = '';
      tapHint.style.display = '';
      resultCard.classList.remove('active');
      scene.style.display = '';
      document.getElementById('magicSparkles').innerHTML = '';
      overlay.classList.add('active');

      requestAnimationFrame(function() { capsule.classList.add('bounce'); });
    }, 700);
  }

  function openCapsule() {
    var capsule = document.getElementById('capsule');
    if (capsule.classList.contains('opened')) return;
    capsule.classList.add('opened');
    document.getElementById('tapHint').style.display = 'none';

    var sparkles = document.getElementById('magicSparkles');
    var icons = ['✨','⭐','💖','🌟','💫','🪄'];
    for (var i = 0; i < 8; i++) {
      var s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      var angle = (i / 8) * 360;
      var dist = 60 + Math.random() * 30;
      var x = Math.cos(angle * Math.PI / 180) * dist;
      var y = Math.sin(angle * Math.PI / 180) * dist;
      s.style.setProperty('--sparkle-end', 'translate('+x+'px, '+y+'px)');
      s.style.left = '50%';
      s.style.top = '50%';
      s.style.animationDelay = (i * 0.05) + 's';
      sparkles.appendChild(s);
    }

    setTimeout(function() {
      capsule.style.display = 'none';
      document.getElementById('capsuleScene').style.display = 'none';

      // Use same character from capsule
      document.getElementById('resultChar').src = CHAR_IMAGES[currentCharIndex];
      document.getElementById('magicText').textContent = '你抽到了 ' + CHAR_NAMES[currentCharIndex] + '！';
      var emojis = ['🎉','🥳','✨','🌟','🎊','💫'];
      document.getElementById('resultEmoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
      document.getElementById('resultPlace').textContent = currentPick;
      document.getElementById('resultCard').classList.add('active');
      launchConfetti();
      isAnimating = false;
    }, 600);
  }

  function launchConfetti() {
    var container = document.getElementById('confetti');
    container.innerHTML = '';
    var items = ['💖','⭐','✨','🌟','💗','🪄','👑','💫'];
    for (var i = 0; i < 35; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.textContent = items[Math.floor(Math.random() * items.length)];
      piece.style.left = Math.random() * 100 + '%';
      piece.style.fontSize = (12 + Math.random() * 14) + 'px';
      piece.style.animationDuration = (2 + Math.random() * 2) + 's';
      piece.style.animationDelay = Math.random() * 0.8 + 's';
      container.appendChild(piece);
    }
    setTimeout(function() { container.innerHTML = ''; }, 5000);
  }

  function closeResult() {
    document.getElementById('capsuleOverlay').classList.remove('active');
    document.getElementById('resultCard').classList.remove('active');
  }

  function retryTwist() {
    closeResult();
    setTimeout(function() { twist(); }, 300);
  }

  function toggleAdmin() {
    var panel = document.getElementById('adminPanel');
    panel.classList.toggle('active');
    if (panel.classList.contains('active')) renderPlaceList();
  }

  function renderPlaceList() {
    var list = document.getElementById('placeList');
    var places = getPlaces();
    if (places.length === 0) {
      list.innerHTML = '<div class="empty-msg">還沒有地點，快來新增吧！✨</div>';
      return;
    }
    list.innerHTML = places.map(function(p, i) {
      var weightLabel = p.weight < 1 ? ' <span style="font-size:12px;color:#ffb6c1;">(低機率)</span>' : '';
      return '<div class="place-item"><span>'+p.name+weightLabel+'</span><button class="delete-btn" onclick="deletePlace('+i+')">✕</button></div>';
    }).join('');
  }

  function addPlace() {
    var input = document.getElementById('newPlace');
    var name = input.value.trim();
    if (!name) return;
    var places = getPlaces();
    places.push({ name: name, weight: 1 });
    savePlaces(places);
    input.value = '';
    renderPlaceList();
    renderBalls();
  }

  function deletePlace(index) {
    var places = getPlaces();
    places.splice(index, 1);
    savePlaces(places);
    renderPlaceList();
    renderBalls();
  }

  function renderBgDeco() {
    var container = document.getElementById('bgDeco');
    var icons = ['✨','⭐','💖','🌟','👑','🪄','💗','💫'];
    for (var i = 0; i < 12; i++) {
      var item = document.createElement('div');
      item.className = 'deco-item';
      item.textContent = icons[Math.floor(Math.random() * icons.length)];
      item.style.left = Math.random() * 100 + '%';
      item.style.top = Math.random() * 100 + '%';
      item.style.animationDelay = Math.random() * 4 + 's';
      item.style.animationDuration = (3 + Math.random() * 3) + 's';
      item.style.fontSize = (14 + Math.random() * 16) + 'px';
      container.appendChild(item);
    }
  }

  renderBalls();
  renderBgDeco();
</script>
